asyncapi: 3.0.0

info:
  title: Sensor Events API
  version: 1.0.0


channels:
  sensors.telemetry:
    address: sensors.telemetry
    messages:
      SensorTelemetry:
        $ref: '#/components/messages/SensorTelemetry'

operations:
  publishSensorTelemetry:
    action: send
    channel:
      $ref: '#/channels/sensors.telemetry'
    summary: Sensors publish telemetry events

  consumeSensorTelemetry:
    action: receive
    channel:
      $ref: '#/channels/sensors.telemetry'
    summary: Sensor Management System consumes telemetry events

components:
  messages:
    SensorTelemetry:
      payload:
        $ref: '#/components/schemas/SensorTelemetry'

  schemas:
    SensorTelemetry:
      type: object
      required:
        - sensorId
        - timestamp
        - value
      properties:
        sensorId:
          type: string
        timestamp:
          type: string
          format: date-time
        value:
          type: number
        unit:
          type: string