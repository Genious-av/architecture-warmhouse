openapi: 3.0.3
info:
  title: Smart Home API
  version: 1.0.0

tags:
  - name: UserController
    description: Operations related to users, including profile management and assignments.
  - name: HouseController
    description: CRUD operations for houses and house management.
  - name: RelationController
    description: Entity relationship management between users, houses, devices, and modules.

paths:
  /users:
    post:
      tags: [UserController]
      summary: Create a new user
      description: Creates a new system user with optional house and module assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, example: "John Doe" }
                email: { type: string, example: "john@mail.com" }
                phone: { type: string }
                houseId: { type: string, format: uuid }
                moduleId: { type: string, format: uuid }
      responses:
        "201":
          description: User successfully created
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "403":
          description: Forbidden
        "500":
          description: Internal error  
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [UserController]
      summary: Get user by ID
      description: Returns user details by unique identifier.
      responses:
        "200":
          description: User found
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error  
    put:
      tags: [UserController]
      summary: Update user
      description: Updates user profile information and assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                houseId: { type: string, format: uuid }
                moduleId: { type: string, format: uuid }
      responses:
        "200":
          description: User updated
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error  
    delete:
      tags: [UserController]
      summary: Delete user
      description: Removes a user from the system.
      responses:
        "204":
          description: User deleted
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error  


  /houses:
    post:
      tags: [HouseController]
      summary: Create house
      description: Creates a new house entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, city]
              properties:
                address: { type: string, example: "Red Square, 1" }
                city: { type: string, example: "MSK" }
      responses:
        "201":
          description: House created
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "403":
          description: Forbidden
        "500":
          description: Internal error  

  /houses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [HouseController]
      summary: Get house by ID
      description: Returns house details.
      responses:
        "200":
          description: House found
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error  
    put:
      tags: [HouseController]
      summary: Update house
      description: Updates house information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address: { type: string }
                city: { type: string }
      responses:
        "200":
          description: House updated
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error  
    delete:
      tags: [HouseController]
      summary: Delete house
      description: Deletes a house.
      responses:
        "204":
          description: House deleted
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error
          
  /users/{userId}/houses/{houseId}:
    post:
      tags: [RelationController]
      summary: Assign house to user
      description: Links a user with a house.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: houseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Relation created
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error
          
  /users/{userId}/modules/{moduleId}:
    post:
      tags: [RelationController]
      summary: Assign module to user
      description: Links a user with a module.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Relation created
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error

  /houses/{houseId}/devices/{deviceId}:
    post:
      tags: [RelationController]
      summary: Assign device to house
      description: Links a device to a house.
      parameters:
        - name: houseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Relation created
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error
