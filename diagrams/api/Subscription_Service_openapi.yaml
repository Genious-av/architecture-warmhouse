openapi: 3.0.3
info:
  title: Subscription service API
  version: 1.0.0

tags:
  - name: SubscriptionController
    description: Operations related to subscriptions and payments.

paths:

  /subscriptions:
    post:
      tags: [SubscriptionController]
      summary: Create a new subscription
      description: Creates a new subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, example: "User subscription" }
                type: { type: string, example: "Regular" }
                endDate: { type: string, format: date}
                status: { type: string, example: "Active" }
      responses:
        "201":
          description: Subscription successfully created
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "403":
          description: Forbidden
        "500":
          description: Internal error  
  /subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [SubscriptionController]
      summary: Get subscription by ID
      description: Returns subscription details by unique identifier.
      responses:
        "200":
          description: Subscription found
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error  
    put:
      tags: [SubscriptionController]
      summary: Update subscription
      description: Updates user profile information and assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "User subscription" }
                type: { type: string, example: "Regular" }
                endDate: { type: string, format: date }
                status: { type: string, example: "Active" }
      responses:
        "200":
          description: Subscription updated
        "400":
          description: Invalid request
        "401":
          description: Unauthorized  
        "404":
          description: Not found
        "403":
          description: Forbidden
        "500":
          description: Internal error